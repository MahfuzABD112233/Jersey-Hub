{% extends 'store/base.html' %}

{% block title %}
Checkout
{% endblock %}

{% block content %}

<div style="
    max-width: 700px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
">

    <h1>Checkout</h1>

    {% for item in cart_items %}

        <div style="
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        ">

            <span>
                {{ item.product.name }}
                × {{ item.quantity }}
            </span>

            <span>
                ৳{{ item.subtotal }}
            </span>

        </div>

    {% endfor %}

    <h2 style="text-align: right;">
        Total: ৳{{ total }}
    </h2>

    <form method="POST">

        {% csrf_token %}

        <button
            type="submit"
            class="btn"
        >
            Place Order
        </button>

    </form>

</div>

{% endblock %}
